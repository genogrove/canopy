name: Create PR

# Auto-opens a PR against main for any pushed branch that doesn't already have one —
# so work pushed from a feature branch surfaces for review without a manual `gh pr create`.
on:
  push:
    branches-ignore: [main]

jobs:
  create-pr:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      # `gh pr create --fill` derives its default title/body from `git diff` against
      # origin/main, so main must be fetched too — the default checkout is single-branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open a PR if one doesn't already exist for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --head "${{ github.ref_name }}" --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh pr create --fill --base main --head "${{ github.ref_name }}"
          fi
